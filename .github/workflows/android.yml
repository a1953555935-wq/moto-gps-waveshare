name: Android

on:
  push:
    branches: ["android/**"]
    paths:
      - "platforms/android/**"
      - "shared/ble_protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "platforms/android/**"
      - "shared/ble_protocol/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: platforms/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
